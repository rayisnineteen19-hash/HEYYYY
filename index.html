<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garden for C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap">
<style>
:root {
  --night: #ffc9de;
  --bg-top: #ffe3ee;
  --bg-bottom: #ff9cc3;
  --ember: #c2185b;
  --ink: #7a1740;
  --ink-soft: #8c2650;
  --leaf: #4f9b4a;
  --rose: #e8708f;
  --font-display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --font-body: "Newsreader", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
}
.stage { position: relative; height: 100%; overflow: hidden; background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom)); }
#garden { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding-inline: max(16px, 6vw);
  padding-bottom: 16vh;
  pointer-events: none;
}
.note {
  position: relative;
  max-width: 31rem;
  min-width: 0;
  text-align: center;
  opacity: 0;
}
body.open .note { animation: rise 1.6s ease-out 2s both; }
.note::before {
  content: "";
  position: absolute;
  inset: -3.5rem -2.5rem;
  z-index: -1;
  background: radial-gradient(ellipse at center, rgba(255, 233, 242, 0.92) 0%, rgba(255, 233, 242, 0.7) 55%, rgba(255, 233, 242, 0) 78%);
}
h1 {
  margin: 0 0 0.55em;
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 500;
  font-size: clamp(2.6rem, 8vw, 4.2rem);
  line-height: 1.05;
  letter-spacing: 0.01em;
  color: var(--ink);
  text-shadow: 0 0 24px rgba(255, 255, 255, 0.8);
  text-wrap: balance;
}
p {
  margin: 0;
  font-style: italic;
  font-size: clamp(1.02rem, 2.7vw, 1.3rem);
  line-height: 1.65;
  color: var(--ink-soft);
  text-wrap: pretty;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}

/* Tap-to-open screen: this tap is what lets the browser play the song */
.gate {
  position: absolute;
  inset: 0;
  z-index: 10;
  width: 100%;
  display: grid;
  place-items: center;
  padding: 0;
  border: 0;
  background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
  color: var(--ink);
  font: italic 500 clamp(1.8rem, 6vw, 2.6rem)/1.25 var(--font-display);
  text-shadow: 0 0 24px rgba(255, 255, 255, 0.8);
  cursor: pointer;
  transition: opacity 1.2s ease;
}
.gate small {
  display: block;
  margin-top: 0.7em;
  font: italic 1rem var(--font-body);
  color: var(--ink-soft);
  text-shadow: none;
  animation: pulse 2.2s ease-in-out infinite;
}
.gate:focus-visible { outline: 2px solid var(--ember); outline-offset: -8px; }

.gate.gone { opacity: 0; pointer-events: none; }
.gate { overflow: hidden; }
.gate > span:not(.heart) { position: relative; z-index: 2; padding: 1.4rem 1.6rem; max-width: 92vw; }
.gate > span:not(.heart)::before {
  content: "";
  position: absolute;
  inset: -1rem -0.5rem;
  z-index: -1;
  background: radial-gradient(ellipse at center, rgba(255, 238, 245, 0.9) 0%, rgba(255, 238, 245, 0.6) 55%, rgba(255, 238, 245, 0) 78%);
}
.heart {
  position: absolute;
  bottom: -60px;
  z-index: 1;
  pointer-events: none;
  user-select: none;
  animation: floatUp linear infinite;
  opacity: 0.9;
}
@keyframes floatUp {
  0% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-60vh) rotate(16deg); }
  100% { transform: translateY(-120vh) rotate(-12deg); }
}
@keyframes pulse { 50% { opacity: 0.45; } }

.sound {
  position: absolute;
  top: calc(14px + env(safe-area-inset-top, 0px));
  right: 16px;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 1px solid rgba(122, 23, 64, 0.4);
  border-radius: 50%;
  background: rgba(255, 240, 246, 0.7);
  color: var(--ink-soft);
  font: 1.3rem/1 var(--font-display);
  cursor: pointer;
  transition: background 0.2s, color 0.2s, opacity 0.2s;
}
.sound[hidden] { display: none; }
.sound:hover { background: rgba(255, 255, 255, 0.9); color: var(--ink); }
.sound:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
.sound[aria-pressed="false"] { opacity: 0.65; }
.sound[aria-pressed="false"]::after {
  content: "";
  position: absolute;
  width: 26px;
  height: 1.5px;
  background: currentColor;
  transform: rotate(-45deg);
}
@media (prefers-reduced-motion: reduce) {
  body.open .note { animation: none; opacity: 1; }
}
</style>
</head>
<body>

<div class="stage">
  <canvas id="garden" aria-hidden="true"></canvas>
  <div class="overlay">
    <main class="note">
      <h1>Hi C,</h1>
      <p>These flowers looked so sweet that I had to share them with someone who’s just as sweet. They made me smile this afternoon, kinda like the way I do when I talk to you.</p>
    </main>
  </div>
  <button class="sound" id="sound" type="button" aria-label="Music" aria-pressed="false" hidden>♪</button>
  <button class="gate" id="gate" type="button">
    <span>I KNOW YOU SAID YOU DONT LIKE FLOWERS BUT...<small>tap to open</small></span>
  </button>
</div>

<!-- No src here on purpose: the song is loaded and played on the tap (see SONG_FILE below). -->
<audio id="song" loop preload="auto"></audio>

<script>
(() => {
  const cv = document.getElementById('garden');
  const ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2;
  let W = 0, H = 0, dpr = 1, sc = 1;
  let flowers = [], blades = [], flies = [];

  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp01 = t => Math.max(0, Math.min(1, t));
  const ease = t => 1 - Math.pow(1 - clamp01(t), 3);

  const ROSE = [
    ['#a50e36', '#cf1f4f', '#ee5a7f'],
    ['#8e0f4a', '#c2185b', '#e8508c'],
    ['#b5121b', '#dc2f2f', '#f26b5c']
  ];
  const CREAM = [
    ['#6a35a8', '#8f5bd0', '#c9a7f0'],
    ['#2f5fc4', '#4f86e8', '#a9c8ff'],
    ['#fffaf2', '#ffe9d6', '#ffd2b0'],
    ['#7a2fa0', '#a557c8', '#dcb0f0']
  ];
  const GREENS = ['#2c7a3a', '#3a8a43', '#2f8040', '#287238'];
  const TYPES = [
    { k: 'rose', w: 0.34, R: [16, 26], pals: ROSE },
    { k: 'sun', w: 0.24, R: [18, 28] },
    { k: 'daisy', w: 0.2, R: [12, 18] },
    { k: 'cream', w: 0.22, R: [15, 23], pals: CREAM }
  ];
  const pickType = () => {
    let r = Math.random(), s = 0;
    for (const t of TYPES) { s += t.w; if (r <= s) return t; }
    return TYPES[0];
  };
  const pickOf = arr => arr[Math.floor(Math.random() * arr.length)];

  function build() {
    sc = Math.max(0.65, Math.min(1.3, W / 1000));
    flowers = [];
    const n = Math.round(Math.max(16, Math.min(48, W / 34)));
    for (let i = 0; i < n; i++) {
      const t = pickType();
      flowers.push({
        t,
        pal: t.pals ? pickOf(t.pals) : null,
        green: pickOf(GREENS),
        x0: (i + rnd(0.1, 0.9)) / n * W,
        y0: H + rnd(0, 10),
        h: rnd(H * 0.24, H * 0.66),
        lean: rnd(-40, 40) * sc,
        bend: rnd(-30, 30) * sc,
        R: rnd(t.R[0], t.R[1]) * sc,
        delay: rnd(0.1, 1.6),
        grow: rnd(1.2, 1.9),
        bloomDur: rnd(0.9, 1.4),
        phase: rnd(0, TAU),
        speed: rnd(0.5, 0.9),
        amp: rnd(5, 10) * sc,
        rot: rnd(0, TAU),
        leaves: [rnd(0.25, 0.4), rnd(0.5, 0.65)],
        sides: [Math.random() < 0.5 ? -1 : 1, Math.random() < 0.5 ? -1 : 1]
      });
    }
    flowers.sort((a, b) => b.h - a.h);

    blades = [];
    const m = Math.round(W / 5);
    for (let i = 0; i < m; i++) {
      blades.push({
        x: rnd(-10, W + 10),
        h: rnd(26, 76) * sc,
        w: rnd(1.6, 3.6) * sc,
        lean: rnd(-14, 14),
        phase: rnd(0, TAU),
        delay: rnd(0, 1.4),
        color: pickOf(GREENS)
      });
    }

    flies = [];
    for (let i = 0; i < 46; i++) {
      flies.push({
        bx: rnd(0, W), by: rnd(H * 0.2, H * 0.95),
        r: rnd(0.8, 2), sp: rnd(0.8, 2), ph: rnd(0, TAU),
        dx: rnd(10, 34), dy: rnd(8, 22)
      });
    }
  }

  function pt(f, u, sway) {
    const x1 = f.x0 + f.lean + sway, y1 = f.y0 - f.h;
    const cx = f.x0 + f.bend + sway * 0.3, cy = f.y0 - f.h * 0.5;
    const a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, c = u * u;
    return [a * f.x0 + b * cx + c * x1, a * f.y0 + b * cy + c * y1];
  }

  function petals(n, r, len, wid, rot, fill) {
    ctx.fillStyle = fill;
    ctx.strokeStyle = 'rgba(96, 12, 52, 0.45)';
    ctx.lineWidth = 1.1;
    for (let i = 0; i < n; i++) {
      ctx.save();
      ctx.rotate(rot + i / n * TAU);
      ctx.beginPath();
      ctx.ellipse(r, 0, len, wid, 0, 0, TAU);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawHead(f, x, y, bloom, tilt) {
    const R = f.R;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(f.rot * 0.2 + tilt);
    ctx.scale(bloom, bloom);
    const k = f.t.k;
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.arc(0, 0, R * 1.12, 0, TAU); ctx.fill();
    if (k === 'rose' || k === 'cream') {
      petals(9, R * 0.55, R * 0.48, R * 0.3, f.rot, f.pal[0]);
      petals(7, R * 0.35, R * 0.4, R * 0.27, f.rot + 0.4, f.pal[1]);
      petals(5, R * 0.15, R * 0.3, R * 0.22, f.rot + 0.9, f.pal[2]);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.arc(0, 0, R * 0.1, 0, TAU); ctx.fill();
    } else if (k === 'sun') {
      petals(18, R * 0.62, R * 0.42, R * 0.14, f.rot, '#f2b51f');
      petals(16, R * 0.5, R * 0.4, R * 0.14, f.rot + 0.17, '#e89a14');
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 0.44);
      g.addColorStop(0, '#7a4a14');
      g.addColorStop(0.7, '#3a2209');
      g.addColorStop(1, '#2a1706');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, R * 0.44, 0, TAU); ctx.fill();
    } else {
      petals(13, R * 0.55, R * 0.5, R * 0.17, f.rot, '#fbf7f0');
      ctx.fillStyle = '#f2c12e';
      ctx.beginPath(); ctx.arc(0, 0, R * 0.26, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  function drawFlower(f, el) {
    const g = ease((el - f.delay) / f.grow);
    if (g <= 0) return;
    const sway = reduce ? 0 : Math.sin(el * f.speed + f.phase) * f.amp * clamp01(g * 1.5);

    ctx.lineCap = 'round';
    ctx.strokeStyle = f.green;
    ctx.lineWidth = 2.4 * Math.max(sc, 0.8);
    ctx.beginPath();
    const N = 24;
    for (let i = 0; i <= N; i++) {
      const p = pt(f, g * i / N, sway);
      if (i) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]);
    }
    ctx.stroke();

    ctx.fillStyle = f.green;
    for (let i = 0; i < 2; i++) {
      const u = f.leaves[i];
      if (g <= u) continue;
      const p = pt(f, u, sway);
      const s = f.sides[i];
      const grown = clamp01((g - u) * 4);
      ctx.beginPath();
      ctx.ellipse(p[0] + s * 11 * sc * grown, p[1], 14 * sc * grown, 5 * sc * grown, s * -0.5, 0, TAU);
      ctx.fill();
    }

    const tip = pt(f, g, sway);
    const bloom = ease((el - f.delay - f.grow) / f.bloomDur);
    if (bloom <= 0) {
      ctx.fillStyle = f.pal ? f.pal[0] : (f.t.k === 'sun' ? '#e8a416' : '#ffffff');
      ctx.beginPath(); ctx.arc(tip[0], tip[1], 3 * sc + 1, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(96,12,52,0.5)'; ctx.lineWidth = 1; ctx.stroke();
    } else {
      drawHead(f, tip[0], tip[1], bloom, sway * 0.01);
    }
  }

  function drawGrass(el) {
    for (const b of blades) {
      const g = ease((el - b.delay) / 1.2);
      if (g <= 0) continue;
      const sway = reduce ? 0 : Math.sin(el * 0.9 + b.phase) * 6;
      const tx = b.x + b.lean + sway, ty = H - b.h * g;
      const mx = b.x + b.lean * 0.2, my = H - b.h * g * 0.55;
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.moveTo(b.x - b.w, H + 2);
      ctx.quadraticCurveTo(mx - b.w * 0.5, my, tx, ty);
      ctx.quadraticCurveTo(mx + b.w * 0.5, my, b.x + b.w, H + 2);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawFlies(el) {
    for (const p of flies) {
      const tw = 0.5 + 0.5 * Math.sin(el * p.sp + p.ph);
      const x = p.bx + Math.sin(el * 0.3 + p.ph) * p.dx;
      const y = p.by + Math.cos(el * 0.25 + p.ph) * p.dy;
      const a = tw * 0.85 * clamp01(el / 0.8);
      ctx.fillStyle = 'rgba(255,255,255,' + (a * 0.35) + ')';
      ctx.beginPath(); ctx.arc(x, y, p.r * 4, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
      ctx.beginPath(); ctx.arc(x, y, p.r, 0, TAU); ctx.fill();
    }
  }

  function render(el) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#ffe3ee');
    bg.addColorStop(1, '#ff9cc3');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    const gi = ease(el / 3);
    const cy = H * 0.62;
    const gr = ctx.createRadialGradient(W / 2, cy, 0, W / 2, cy, Math.max(W, H) * 0.55);
    gr.addColorStop(0, 'rgba(255,255,255,' + (0.55 * gi) + ')');
    gr.addColorStop(0.45, 'rgba(255,255,255,' + (0.18 * gi) + ')');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gr;
    ctx.fillRect(0, 0, W, H);

    for (const f of flowers) drawFlower(f, el);
    drawGrass(el);
    drawFlies(el);
  }

  // The garden starts growing the moment the visitor taps the gate.
  let start = performance.now();
  window.restartGarden = () => { start = performance.now(); };
  function frame(now) {
    render(Math.max(0, (now - start) / 1000));
    requestAnimationFrame(frame);
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth;
    H = cv.clientHeight;
    if (!W || !H) return;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    build();
    if (reduce) render(30);
  }

  resize();
  if ('ResizeObserver' in window) new ResizeObserver(resize).observe(cv);
  else addEventListener('resize', resize);
  if (!reduce) requestAnimationFrame(frame);
})();
</script>

<script>
(() => {
  const SONG_FILE = 'song.mp3';  // put your song next to this file and match the name here
  const TARGET_VOLUME = 0.7;     // final loudness, from 0 to 1
  const FADE_IN_MS = 5000;       // how long the song takes to fade in

  const audio = document.getElementById('song');
  const btn = document.getElementById('sound');
  const gate = document.getElementById('gate');
  let wantOn = true;
  let started = false;
  let opened = false;
  let fade = 0;

  function fadeTo(v, ms, done) {
    cancelAnimationFrame(fade);
    const from = audio.volume, t0 = performance.now();
    const step = now => {
      const k = Math.min(1, (now - t0) / ms);
      audio.volume = from + (v - from) * k;
      if (k < 1) fade = requestAnimationFrame(step);
      else if (done) done();
    };
    fade = requestAnimationFrame(step);
  }

  function setUi(on) { btn.setAttribute('aria-pressed', on ? 'true' : 'false'); }

  function play() {
    audio.volume = 0;
    const p = audio.play();
    if (p && p.then) {
      p.then(() => {
        started = true;
        btn.hidden = false;
        setUi(true);
        fadeTo(TARGET_VOLUME, FADE_IN_MS);
      }).catch(() => { /* no song file yet; the garden still plays */ });
    }
  }

  // The tap: browsers only allow sound after a click, and this is that click.
  function openGarden() {
    if (opened) return;
    opened = true;
    audio.src = SONG_FILE;
    play();
    document.body.classList.add('open');
    gate.classList.add('gone');
    window.restartGarden && window.restartGarden();
  }
  gate.addEventListener('click', openGarden);

  btn.addEventListener('click', () => {
    if (audio.paused) {
      wantOn = true;
      play();
    } else {
      wantOn = false;
      setUi(false);
      fadeTo(0, 600, () => audio.pause());
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) audio.pause();
    else if (wantOn && started && audio.paused) play();
  });

  audio.addEventListener('error', () => { btn.hidden = true; });
})();
</script>

<script>
// Little hearts floating all around the intro screen
(() => {
  const gate = document.getElementById('gate');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const EM = ['💗','💖','💕','💞','💘','🌸','💓'];
  for (let i = 0; i < 40; i++) {
    const h = document.createElement('span');
    h.className = 'heart';
    h.setAttribute('aria-hidden', 'true');
    h.textContent = EM[Math.floor(Math.random() * EM.length)];
    h.style.left = Math.random() * 100 + '%';
    h.style.fontSize = (18 + Math.random() * 34) + 'px';
    if (reduce) {
      h.style.animation = 'none';
      h.style.bottom = 'auto';
      h.style.top = Math.random() * 100 + '%';
    } else {
      h.style.animationDuration = (9 + Math.random() * 12) + 's';
      h.style.animationDelay = (-Math.random() * 20) + 's';
    }
    gate.appendChild(h);
  }
})();
</script>
</body>
</html>
